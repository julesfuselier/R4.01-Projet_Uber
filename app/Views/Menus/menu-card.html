<div class="menu-card" style="border: 2px solid #333; padding: 15px; margin: 10px; border-radius: 8px;">
    <h2>{NOM}</h2>
    <p>Créé par : <strong>{CREATEUR}</strong></p>
    <p>Prix total : {PRIX} €</p>
    <a href="/menus/{ID}/edit" style="padding: 6px 12px; background-color: #007bff; color: white; border-radius: 4px; text-decoration: none; margin-right: 5px;">Modifier</a>
    <form method="POST" action="/menus/{ID}/delete" style="display:inline;" onsubmit="return confirm('Supprimer ce menu ?')">
        <button type="submit" style="padding: 6px 12px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Supprimer</button>
    </form>
</div>
